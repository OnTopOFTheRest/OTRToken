[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://www.geckoterminal.com https://*.geckoterminal.com https://api.geckoterminal.com https://api.coingecko.com https://*.coingecko.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://widgets.coingecko.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://i.ibb.co data: https://* https://assets.coingecko.com; frame-src 'self' https://widgets.coingecko.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Security headers for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Block access to sensitive files
[[headers]]
  for = "/*.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"